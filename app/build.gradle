plugins {
    id 'com.android.application'
}

// Signing credentials are kept out of version control. Copy properties.gradle.example
// to properties.gradle and fill it in to produce a signed release build.
def hasSigningProperties = file('properties.gradle').exists()
if (hasSigningProperties) {
    apply from: 'properties.gradle'
}

android {
    namespace = 'com.github.kunoisayami.telegramhiddenphone'
    compileSdk = 36

    if (hasSigningProperties) {
        signingConfigs {
            config {
                keyAlias = 'key0'
                keyPassword = KeyPassword
                storeFile = file(keyStoreFile)
                storePassword = StorePassword
            }
        }
    }

    defaultConfig {
        applicationId = "com.github.kunoisayami.telegramhiddenphone"
        minSdk = 28
        targetSdk = 36
        versionCode = 2
        versionName = "1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningProperties) {
                signingConfig = signingConfigs.config
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    compileOnly 'de.robv.android.xposed:api:82'
    // Runtime dex signature search to survive Telegram's R8 obfuscation
    implementation 'org.luckypray:dexkit:2.2.0'
}
